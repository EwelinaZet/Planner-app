<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Kalendarz</title>

    <!-- FullCalendar (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <style>
        body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          margin: 0;
          padding: 0;
          background: #f5f5f5;
          color: #222;
        }

        .page {
          max-width: 1100px;
          margin: 2rem auto;
          background: #fff;
          border-radius: 10px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.08);
          padding: 1.5rem;
        }

        h1 {
          margin: 0 0 1rem 0;
          font-size: 1.4rem;
        }

        #calendar {
          min-height: 600px;
        }

        .loading {
          text-align: center;
          padding: 2rem;
          color: #666;
          font-style: italic;
        }
    </style>
</head>
<body>
<div class="page">
    <h1>Kalendarz wydarzeń</h1>
    <div id="calendar"></div>
    <div id="loading" class="loading">Wczytywanie wydarzeń…</div>
</div>

<script th:inline="javascript">
    // URL do API – Thymeleaf podstawia kontekst aplikacji, jeśli jest
    const apiUrl = /*[[@{/events}]]*/ '/api/calendar/events';

    // Zakres: od początku bieżącego miesiąca do końca za 2 miesiące
    const now = new Date();
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endOfRange = new Date(now.getFullYear(), now.getMonth() + 3, 0, 23, 59, 59);

    const from = startOfMonth.toISOString();
    const to = endOfRange.toISOString();

    const url = apiUrl + "?from=" + encodeURIComponent(from) + "&to=" + encodeURIComponent(to);

    (async function init() {
      const loadingEl = document.getElementById('loading');

      try {
        const res = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            // Jeśli używasz sesji/cookie, odkomentuj:
            // credentials: 'include',
          },
        });

        if (!res.ok) {
          const text = await res.text().catch(() => '');
          throw new Error(`Bąd serwera: ${res.status} ${res.statusText}${text ? ' – ' + text : ''}`);
        }

        const events = await res.json();

        if (!Array.isArray(events)) {
          throw new Error('Oczekiwano tablicy wydarzeń.');
        }

        // Konwersja na format FullCalendar
        const fcEvents = events.map(ev => ({
          id: ev.id,
          title: ev.title ?? '(bez tytuу)',
          start: ev.start,
          end: ev.end,
          extendedProps: {
            status: ev.status,
          },
        }));

        const calendarEl = document.getElementById('calendar');

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'pl',
          firstDay: 1, // poniedziaek
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay',
          },
          events: fcEvents,
          eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          },
          eventDisplay: 'block',
          eventContent: function(arg) {
            const status = arg.event.extendedProps.status;
            const timeText = arg.timeText;

            const outer = document.createElement('div');
            outer.style.display = 'flex';
            outer.style.flexDirection = 'column';
            outer.style.gap = '0.15rem';

            const top = document.createElement('div');
            top.style.display = 'flex';
            top.style.justifyContent = 'space-between';
            top.style.alignItems = 'center';
            top.style.width = '100%';

            const title = document.createElement('span');
            title.textContent = arg.event.title;
            title.style.fontWeight = '600';

            const statusBadge = document.createElement('span');
            statusBadge.textContent = status ?? '';
            statusBadge.style.fontSize = '0.7rem';
            statusBadge.style.padding = '0.1rem 0.35rem';
            statusBadge.style.borderRadius = '999px';
            statusBadge.style.background = 'rgba(255,255,255,0.25)';
            statusBadge.style.color = '#fff';
            statusBadge.style.whiteSpace = 'nowrap';

            top.appendChild(title);
            if (status) {
              top.appendChild(statusBadge);
            }

            const time = document.createElement('div');
            time.style.fontSize = '0.75rem';
            time.style.opacity = '0.9';
            time.textContent = timeText;

            outer.appendChild(top);
            if (timeText.trim()) {
              outer.appendChild(time);
            }

            return { domNodes: [outer] };
          },
          eventClick: function(info) {
            const ev = info.event;
            const status = ev.extendedProps.status;

            const start = ev.start ? ev.start.toLocaleString() : '—';
            const end = ev.end ? ev.end.toLocaleString() : '—';

            alert(
              `Tytu: ${ev.title}\n` +
              `Status: ${status ?? '—'}\n` +
              `Start: ${start}\n` +
              `Koniec: ${end}\n` +
              `ID: ${ev.id ?? '—'}`
            );
          },
        });

        calendar.render();
      } catch (err) {
        loadingEl.textContent = 'Wystąpi bąd: ' + (err.message || String(err));
        loadingEl.style.color = '#b91c1c';
        return;
      }

      loadingEl.style.display = 'none';
    })();
</script>
</body>
</html>
